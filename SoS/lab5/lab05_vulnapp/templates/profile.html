{% extends "base.html" %}
{% block content %}
<h1>Профіль</h1>
{# ВИПРАВЛЕНО В4 (CWE-352): форма несе прихований синхронізований токен сесії. #}
<form method="post">
  <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
  <p><label>ПІБ <input name="full_name" value="{{ user['full_name'] }}"></label></p>
  <p><label>Пошта <input name="email" value="{{ user['email'] }}"></label></p>
  <p><button type="submit">Зберегти</button></p>
</form>
{% endblock %}
